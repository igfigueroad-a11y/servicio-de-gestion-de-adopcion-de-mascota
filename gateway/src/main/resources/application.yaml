eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


spring:
  application:
    name: gateway
    cloud:
      gateway:
        discovery:
         locator:
           enabled:
           lower-case-service-id: true
      routes:
        - id:Ms-usuarios
         uri: lb://msusarios
         predicates:
         - Path=/api/v1/usuarios /**
        - id:acceso
         uri:lb//accesoms
         predicates:
        - Path=/api/v1/acceso/**
       

