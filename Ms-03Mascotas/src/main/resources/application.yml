spring:
  application:
    name: Ms-03Mascotas
  datasource:
    url: jdbc:mysql://localhost:3306/db_mascotas?useSSL=false&serverTimezone=UTC
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8083

  eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

      springdoc:
  api-docs:
    enabled: true
    version: openapi_3_0
  swagger-ui:
    enabled: true