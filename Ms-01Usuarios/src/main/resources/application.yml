spring:
  application:
    name: msusarios
  datasource:
    url: jdbc:mysql://localhost:3306/db_usuarios
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8081

springdoc:
  api-docs:
    enabled: true
    version: openapi_3_0
  swagger-ui:
    enabled: true