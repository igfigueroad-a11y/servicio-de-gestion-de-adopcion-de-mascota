server:
  port: 8084

spring:
  application:
    name: ms-04tipomascota

  datasource:
    url: jdbc:mysql://localhost:3306/db_tipos
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/